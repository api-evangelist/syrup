name: Syrup
description: 'Syrup (Syrup Tech) is an AI-powered inventory optimization and demand-forecasting
  platform for retail and apparel brands. Its machine-learning decision-support engine combines
  transactional, marketing, and inventory data with external signals such as social trends and
  weather to recommend how brands produce, buy, and allocate inventory across omnichannel
  commerce, reducing stockouts and overproduction. Founded in 2021 by James Theuerkauf and
  Ferdinand Stockmann, Syrup raised a $17.5M Series A led by Accel and was acquired by Anaplan in
  September 2025; syrup.tech now redirects to anaplan.com. Syrup exposes no public developer API
  surface.'
